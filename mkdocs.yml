site_name: OpenSCAD for Mere Mortals
site_description: Plain-language modelling in OpenSCAD. Writing solid geometry as code, primitives, transformations, booleans, variables and modules, parametric designs changed from the command line, text as geometry, measured exports for printing, practised on a project box, a plant pot, a name tag, and a bracket.
site_url: https://paulsullivan33-dev.github.io/openscad-for-mere-mortals/

